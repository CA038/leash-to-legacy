<script>

  function renderVideos(videos) {
    const container = document.getElementById('videos-grid');
    if (!container) return;

    container.innerHTML = '';

    if (!videos || videos.length === 0) {
      container.innerHTML = '<p style="grid-column: 1 / -1; text-align: center; padding: 40px;">No videos added yet.</p>';
      return;
    }

    videos.forEach(video => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.dataset.categories = video.categories?.join(',') || '';

      card.innerHTML = `
        <video class="plyr-video" controls playsinline poster="${video.thumbnail || ''}">
          <source src="${video.url}" type="video/mp4">
          Your browser does not support video.
        </video>
        <h3>${video.title}</h3>
        <p>${video.description || ''}</p>
      `;

      container.appendChild(card);
    });

    document.querySelectorAll('.plyr-video').forEach(video => {
      new Plyr(video);
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    window.supabaseClient
      .from('training_videos')
      .select('*')
      .then(({ data, error }) => {
        if (error) throw error;
        renderVideos(data || []);
      })
      .catch(error => {
        console.error('Error al cargar desde Supabase:', error);
        document.getElementById('videos-grid').innerHTML = '<p style="grid-column: 1 / -1; text-align: center; color: red;">Error al cargar los videos.</p>';
      });
  });

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      const filter = btn.dataset.filter;
      document.querySelectorAll('.video-card').forEach(card => {
        if (filter === 'all' || card.dataset.categories.includes(filter)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    });
  });
</script>
